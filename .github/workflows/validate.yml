name: Validate Bang1 source
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find run -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Live fixture grouping regression
        run: php .github/scripts/test_live_groups.php
      - name: Runner G-number and deletion-rule regression
        run: php .github/scripts/test_runner_rules.php
      - name: Verified athlete photo comparison regression
        run: php .github/scripts/test_runner_photo_review.php
      - name: Admin multi-school runner management regression
        run: node .github/scripts/test_runner_admin_school.js
      - name: Schedule registration and heat mapping regression
        run: php .github/scripts/test_schedule_entries.php
      - name: Staff result numbering and separate heat counts regression
        run: php .github/scripts/test_staff_results_fixtures.php
      - name: Athlete age/category and actual school-grade eligibility regression
        run: php .github/scripts/test_runner_age_groups.php
      - name: Real schedule integration for event 31 official and seeded qualifiers
        run: php .github/scripts/test_final_event31_integration.php
      - name: Qualified final visible in event schedule and LIVE
        run: php .github/scripts/test_final_schedule_live.php
      - name: Preliminary top-three qualification and final lane allocation regression
        run: php .github/scripts/test_final_qualification.php
      - name: Eight-school entry cap for races aged 14 and above
        run: php .github/scripts/test_school_quota.php
      - name: Browser athlete eligibility and server guard regression
        run: node .github/scripts/test_runner_eligibility_client.js
      - name: Drive upload diagnostic regression
        run: php .github/scripts/test_drive_bridge_errors.php
      - name: Historical champion persistence and official final selection
        run: php .github/scripts/test_champion_history.php
      - name: Olympic podium and relay portrait regression
        run: node .github/scripts/test_breaking_podium.js
      - name: School crest security and school-name matching
        run: php .github/scripts/test_school_branding.php
      - name: Flag upload and broadcast placement regression
        run: node .github/scripts/test_school_flags.js
      - name: QR lookup token parser regression
        run: php .github/scripts/test_qr_checkin_rules.php
      - name: Manager QR scanner permissions and shared attendance regression
        run: node .github/scripts/test_qr_checkin_client.js
      - name: PWA installability and icon regression
        run: node .github/scripts/test_pwa_install.js
      - name: Manager LIVE final qualification picker refresh regression
        run: node .github/scripts/test_live_qualified_picker.js
      - name: Locked preliminary selection and immutable registration regression
        run: node .github/scripts/test_locked_prelim_checkin.js
      - name: Manager LIVE check-in permission regression
        run: node .github/scripts/test_live_checkin_permissions.js
      - name: Staff result color regression
        run: node .github/scripts/test_staff_results_colors.js
      - name: Closed runner registry edit-only regression
        run: node .github/scripts/test_closed_runner_edit_only.js
      - name: JavaScript syntax
        run: |
          find run -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('run/legacy-app.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          for i,script in enumerate(scripts):
              if not script.strip(): continue
              with tempfile.NamedTemporaryFile(suffix='.js',mode='w+',encoding='utf-8') as f:
                  f.write(script);f.flush()
                  subprocess.run(['node','--check',f.name],check=True)
          print(f'Validated {len(scripts)} original inline scripts')
          PY
      - name: Check public repository for accidentally committed sensitive files
        shell: bash
        run: |
          if find . -path './.git' -prune -o -type f \
            \( -name '*.xlsx' -o -name '*.xls' -o -name '*.json.gz' -o -name '*.sql.gz' -o -name '*.env' \) -print | grep -q .; then
            echo '::error::Sensitive data or environment file found in public repository'
            exit 1
          fi
