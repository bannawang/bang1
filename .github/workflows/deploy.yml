name: Deploy Bang1 (FTPS)
on:
  push:
    branches: [main]
    paths:
      - 'run/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bang1-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTPS_HOST: ${{ secrets.FTPS_HOST }}
      FTPS_PORT: ${{ secrets.FTPS_PORT }}
      FTPS_USER: ${{ secrets.FTPS_USER }}
      LFTP_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      DRIVE_BRIDGE_URL: ${{ secrets.DRIVE_BRIDGE_URL }}
      DRIVE_BRIDGE_TOKEN: ${{ secrets.DRIVE_BRIDGE_TOKEN }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check mandatory configuration
        shell: bash
        run: |
          for key in FTPS_HOST FTPS_PORT FTPS_USER LFTP_PASSWORD DB_HOST DB_NAME DB_USER DB_PASSWORD DEPLOY_TOKEN; do
            if [ -z "${!key}" ]; then echo "::error::Missing secret ${key}"; exit 1; fi
          done
      - name: Validate PHP
        run: |
          find run -name '*.php' -type f -print0 | xargs -0 -n 1 php -l
      - name: Build private server config (never commit)
        shell: bash
        run: |
          mkdir -p .private
          python3 - <<'PY'
          import os,base64
          keys=['DB_HOST','DB_NAME','DB_USER','DB_PASSWORD','DEPLOY_TOKEN','DRIVE_BRIDGE_URL','DRIVE_BRIDGE_TOKEN']
          with open('.private/config.php','w') as f:
              f.write('<?php\nreturn [\n')
              for key in keys:
                  val=base64.b64encode(os.getenv(key,'').encode()).decode()
                  f.write("  '"+key.lower()+"' => base64_decode('"+val+"'),\n")
              f.write('];\n')
          PY
          cat > .private/.htaccess <<'EOF'
          <IfModule mod_authz_core.c>
          Require all denied
          </IfModule>
          <IfModule !mod_authz_core.c>
          Order allow,deny
          Deny from all
          </IfModule>
          EOF
      - name: Install FTPS client and PWA icon renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp librsvg2-bin
      - name: Build installable PWA icons
        shell: bash
        run: |
          set -euo pipefail
          rsvg-convert --width=192 --height=192 run/icon.svg --output=run/icon-192.png
          rsvg-convert --width=512 --height=512 run/icon.svg --output=run/icon-512.png
          rsvg-convert --width=180 --height=180 run/icon.svg --output=run/icon-180.png
          rsvg-convert --width=512 --height=512 run/icon-maskable.svg --output=run/icon-maskable-512.png
          for icon in run/icon-192.png run/icon-512.png run/icon-180.png run/icon-maskable-512.png; do
            test -s "$icon"
            test "$(file -b --mime-type "$icon")" = "image/png"
          done
      # For a normal source edit, only changed top-level run/ files need upload.
      # Nested changes, deletions, icons, manual runs and unknown diffs retain the full mirror.
      - name: Select incremental upload files
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          rm -f /tmp/bang1-incremental-upload.lst
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-status --no-renames "$BEFORE_SHA" HEAD -- run/ > /tmp/bang1-changed.tsv
            python3 - <<'PY'
          from pathlib import Path
          import re
          changed = Path('/tmp/bang1-changed.tsv').read_text().splitlines()
          fast_files = []
          safe = bool(changed) and len(changed) <= 15
          for row in changed:
              parts = row.split('\t')
              if len(parts) != 2:
                  safe = False
                  break
              status, path = parts
              # Generate PWA raster assets and handle nested/removed files with full mirror.
              # Existing nested PHP/JS files can be uploaded directly without
              # mirroring all uploads and runner documents (never remove them).
              # New nested paths still need a full mirror to create directories.
              nested = len(path.split('/')) > 2
              valid_path = bool(re.fullmatch(r'run/[A-Za-z0-9._/-]+', path))
              if (status not in ('M','A') or not valid_path or
                  '..' in path.split('/') or
                  (nested and status != 'M') or
                  path in ('run/icon.svg','run/icon-maskable.svg')):
                  safe = False
                  break
              fast_files.append(path)
          if safe:
              Path('/tmp/bang1-incremental-upload.lst').write_text(
                  '\n'.join(fast_files) + '\n')
              print(f'Incremental FTPS upload: {len(fast_files)} changed file(s)')
          else:
              print('Using full FTPS mirror for nontrivial or unknown changes')
          PY
          else
            echo "Using full FTPS mirror (manual run or unavailable Git diff)"
          fi
      - name: Secure upload to restricted FTP root /bang1/
        shell: bash
        run: |
          set -euo pipefail
          {
            cat <<'LFTP'
          set net:timeout 15
          set net:max-retries 1
          set net:reconnect-interval-base 3
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set cmd:fail-exit yes
          # Existing production /bang1/run is provisioned already.
          # Do not issue mkdir: some DirectAdmin servers hang on it.
          cd run
          LFTP
            if [[ -s /tmp/bang1-incremental-upload.lst ]]; then
              echo "Uploading changed files only" >&2
              while IFS= read -r file; do
                printf 'put %s -o %s\n' "$file" "${file#run/}"
              done < /tmp/bang1-incremental-upload.lst
            else
              echo "Performing full mirror" >&2
              echo 'mirror --reverse --verbose --only-newer --parallel=2 run .'
            fi
            cat <<'LFTP'
          # Keep security rules and private configuration on the server.
          put run/uploads/school-logos/.htaccess -o uploads/school-logos/.htaccess
          cd ..
          # The production private config directory already exists.
          cd .private
          put .private/config.php -o config.php
          put .private/.htaccess -o .htaccess
          bye
          LFTP
          } > /tmp/bang1-upload.lftp
          # If only the existing event scheduling PHP changed, try native
          # curl FTPS first. This avoids lftp's intermittent control channel
          # stall and never transfers/mutates database or registration records.
          uploaded=false
          if [[ -s /tmp/bang1-incremental-upload.lst ]] &&
             [[ "$(wc -l < /tmp/bang1-incremental-upload.lst)" -eq 1 ]] &&
             grep -Fxq 'run/event-management.php' /tmp/bang1-incremental-upload.lst; then
            echo "Trying targeted curl FTPS upload for event-management.php"
            FTPS_SCHEME=ftp
            [[ "$FTPS_PORT" == "990" ]] && FTPS_SCHEME=ftps
            NETRC_FILE=/tmp/bang1-upload.netrc
            printf 'machine %s\nlogin %s\npassword %s\n' "$FTPS_HOST" "$FTPS_USER" "$LFTP_PASSWORD" > "$NETRC_FILE"
            chmod 600 "$NETRC_FILE"
            if timeout --signal=TERM --kill-after=5s 65s \
              curl --fail --silent --show-error --ssl-reqd --ftp-pasv --ftp-skip-pasv-ip \
                --netrc-file "$NETRC_FILE" --connect-timeout 12 --max-time 58 \
                --upload-file run/event-management.php \
                "${FTPS_SCHEME}://${FTPS_HOST}:${FTPS_PORT}/run/event-management.php"; then
              uploaded=true
              echo "Targeted curl FTPS transfer completed"
            else
              echo "::warning::Targeted curl FTPS transfer unavailable; falling back to lftp"
            fi
            rm -f "$NETRC_FILE"
          fi
          if [[ "$uploaded" != true ]]; then
          for attempt in 1 2 3; do
            echo "FTPS upload attempt ${attempt}/3"
            if timeout --signal=TERM --kill-after=10s 85s \
              lftp --env-password -u "$FTPS_USER" -p "$FTPS_PORT" "$FTPS_HOST" < /tmp/bang1-upload.lftp; then
              uploaded=true
              break
            fi
            echo "::warning::FTPS attempt ${attempt} unsuccessful"
            sleep "$((attempt*3))"
          done
          fi
          if [[ "$uploaded" != true ]]; then
            echo "::error::FTPS could not upload the revision after 3 attempts"
            exit 1
          fi
      - name: Verify updated program print code on public website
        shell: bash
        run: |
          BASE="${PUBLIC_BASE_URL:-https://www.bannawang.ac.th/bang1/run}"
          curl --fail-with-body --location --silent --show-error --retry 2 \
            --connect-timeout 15 --max-time 45 \
            -H 'Cache-Control: no-cache' \
            "${BASE%/}/?verify=${GITHUB_SHA}" > /tmp/bang1-deployed-program.html
          if ! grep -Fq 'PROGRAM_PRINT_REVISION: 20261119-simplified-pending-note' /tmp/bang1-deployed-program.html; then
            echo "::error::Public site still serves the old program-print JavaScript"
            exit 1
          fi
          if grep -Fq 'program-waiting-marker' /tmp/bang1-deployed-program.html; then
            echo "::error::Public site still includes the removed pending marker"
            exit 1
          fi
          echo "PASS: public site serves revised printable athletics program"
      - name: Apply idempotent DB schema
        shell: bash
        run: |
          BASE="${PUBLIC_BASE_URL:-https://www.bannawang.ac.th/bang1/run}"
          curl --fail-with-body --silent --show-error --retry 2 --connect-timeout 15 --max-time 90 \
            -X POST -H "X-Deploy-Token: ${DEPLOY_TOKEN}" "${BASE%/}/setup/migrate.php"

      - name: Verify imported records in MariaDB (aggregate counts only)
        shell: bash
        run: |
          BASE="${PUBLIC_BASE_URL:-https://www.bannawang.ac.th/bang1/run}"
          curl --fail-with-body --silent --show-error --retry 2 --connect-timeout 15 --max-time 90 \
            -X POST -H "X-Deploy-Token: ${DEPLOY_TOKEN}" "${BASE%/}/setup/verify.php" > /tmp/bang1-import-check.json
          jq -e '.success == true and (.source_rows_total | type == "number")' /tmp/bang1-import-check.json >/dev/null
          jq '{source_rows_total,table_counts,quality_counts,coach_roles,alerts,event31_qualifier_summary}' /tmp/bang1-import-check.json
          jq '{race37_38_diagnostics}' /tmp/bang1-import-check.json
          # Both reserved finals must now appear after the original H1/H2
          # without touching the persisted lane assignments.
          jq -e '
            .race37_38_diagnostics as $d |
            ($d["37"].schedule | any(.round=="รอผลการแข่งขันรอบคัดเลือก" or .round=="ชิงชนะเลิศ"))
            and ($d["38"].schedule | any(.round=="รอผลการแข่งขันรอบคัดเลือก" or .round=="ชิงชนะเลิศ"))
            and ($d["37"].preview | length > 0)
            and ($d["38"].preview | length > 0)
            and ($d["37"].staff | length > 0)
            and ($d["38"].staff | length > 0)
          ' /tmp/bang1-import-check.json >/dev/null
          if [ "$(jq -r '.source_rows_total' /tmp/bang1-import-check.json)" -lt 1 ]; then
            echo "::warning::There are no imported records in MariaDB yet"
          fi

      - name: Smoke-test live dashboard and public check-in state
        shell: bash
        run: |
          BASE="${PUBLIC_BASE_URL:-https://www.bannawang.ac.th/bang1/run}"
          curl --fail-with-body --location --silent --show-error --retry 2 \
            --connect-timeout 15 --max-time 45 "${BASE%/}/live/" > /tmp/bang1-live-page.html
          grep -q 'schoolGrid' /tmp/bang1-live-page.html
          grep -q 'nextFixture' /tmp/bang1-live-page.html
          grep -q 'latestResultTicker' /tmp/bang1-live-page.html
          grep -q 'raceBreaking' /tmp/bang1-live-page.html
          grep -q 'school-branding.css' /tmp/bang1-live-page.html
          grep -q 'sportHeroFlag' /tmp/bang1-live-page.html
          grep -q 'breakingWinners' /tmp/bang1-live-page.html
          grep -q 'newsSoundBreaking' /tmp/bang1-live-page.html
          grep -q 'eventHeading' /tmp/bang1-live-page.html
          grep -q 'nextProgressTitle' /tmp/bang1-live-page.html
          curl --fail-with-body --silent --show-error --retry 2 \
            --connect-timeout 15 --max-time 45 "${BASE%/}/api.php?action=live_state" > /tmp/bang1-live-check.json
          jq -e '.success == true and (.display.mode == "sport" or .display.mode == "checkin") and (.display.slideSeconds == 15) and (.serverNowMs | type == "number") and (.fixtures | type == "array") and (.next | type == "array") and (.latestResults | type == "array") and (.schools | length == 10) and (.schools | all((.registered | type == "boolean") and (.athletes | type == "array") and (.totalAthletes | type == "number") and (.logo == null or (.logo | type == "string"))))' /tmp/bang1-live-check.json >/dev/null
          jq '{success,display_mode:.display.mode,fixture_count:(.fixtures|length),school_columns:(.schools|length),recent_results:(.latestResults|length)}' /tmp/bang1-live-check.json
          # Aggregate-only final integration check: no runner names, IDs, or images.
          jq '{event31_final:([.fixtures[] | select(.eventId == 31 and .round == "รอบชิง") | {eventId,teams,round,qualifiedFinal}]),recent_preliminary_result_counts:([.latestResults[] | select(.eventId == 23 or .eventId == 24) | {eventId,heat,places:(.places|length)}])}' /tmp/bang1-live-check.json
          if jq -e '.display.mode == "sport" and (.fixtures|length)>0' /tmp/bang1-live-check.json >/dev/null; then
            FIXTURE_KEY="$(jq -r '.fixtures[0].key' /tmp/bang1-live-check.json)"
            curl --fail-with-body --silent --show-error --retry 2 \
              --connect-timeout 15 --max-time 45 \
              "${BASE%/}/api.php?action=live_sport_fixture&fixtureKey=${FIXTURE_KEY}" > /tmp/bang1-sport-check.json
            jq -e '.success == true and (.fixture.key | type == "string") and (.schools|length == 10) and (.schools | all(.athletes | type == "array"))' /tmp/bang1-sport-check.json >/dev/null
            jq '{sport_fixture:.fixture.eventNumberLabel,school_columns:(.schools|length)}' /tmp/bang1-sport-check.json
          fi
      - name: Verify PWA manifest and raster icons on deployed host
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PUBLIC_BASE_URL:-https://www.bannawang.ac.th/bang1/run}"
          curl --fail-with-body --location --silent --show-error --retry 2 \
            "${BASE%/}/manifest.webmanifest" > /tmp/bang1-pwa-manifest.json
          jq -e '.display == "standalone" and (.icons | map(.sizes) | index("192x192") != null) and (.icons | map(.sizes) | index("512x512") != null) and (.icons | any(.purpose == "maskable"))' /tmp/bang1-pwa-manifest.json >/dev/null
          for name in icon-192.png icon-512.png icon-180.png icon-maskable-512.png; do
            curl --fail-with-body --location --silent --show-error --retry 2 \
              "${BASE%/}/${name}" -o "/tmp/bang1-${name}"
            test "$(file -b --mime-type "/tmp/bang1-${name}")" = "image/png"
          done
          echo "PASS PWA manifest and four raster icons on production"
      - name: Probe Drive upload bridge from production host (no real file upload)
        shell: bash
        run: |
          BASE="${PUBLIC_BASE_URL:-https://www.bannawang.ac.th/bang1/run}"
          curl --fail-with-body --silent --show-error --retry 2 \
            --connect-timeout 15 --max-time 55 -X POST \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            "${BASE%/}/setup/drive-check.php" > /tmp/bang1-drive-health.json
          jq -e '.code | type == "string"' /tmp/bang1-drive-health.json > /dev/null
          jq '{success,code,httpStatus}' /tmp/bang1-drive-health.json
          if ! jq -e '.success == true' /tmp/bang1-drive-health.json > /dev/null; then
            echo "::warning::Google Drive upload bridge is not ready. See its sanitized diagnostic code above."
          fi
